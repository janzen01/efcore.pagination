# GitHub Pages site for the guide — https://janzen01.github.io/efcore.pagination/
#
# Built by GitHub Pages' own Jekyll (Settings -> Pages -> Deploy from a branch -> master /docs).
# There is deliberately no workflow: nothing here needs a build step, so there is nothing to keep green.
# GH Pages runs Jekyll 3.10 with jekyll-remote-theme 0.4.3; just-the-docs v0.12.0 needs only
# jekyll >= 3.8.5 and the two plugins below, and its SCSS is @import-only, so libsass can compile it.

title: Janzen.Pagination
description: Dynamic, configuration-driven pagination, filtering and sorting for EF Core and ASP.NET Core
url: https://janzen01.github.io
baseurl: /efcore.pagination

# /guide/query-string/ rather than /guide/query-string.html. Pinned before the first release because
# these URLs ship inside the 10.0.0 package READMEs and cannot be corrected for that version afterwards.
permalink: pretty

remote_theme: just-the-docs/just-the-docs@v0.12.0

plugins:
  - jekyll-seo-tag        # the theme's default layout calls {% seo %}
  - jekyll-include-cache  # the theme's includes use include_cached
  - jekyll-sitemap

color_scheme: dark
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  GitHub: https://github.com/janzen01/efcore.pagination
  NuGet: https://www.nuget.org/packages/Janzen.Pagination.EntityFrameworkCore
aux_links_new_tab: true

# The theme loads mermaid from jsDelivr; the diagram styling lives in _includes/mermaid_config.js.
mermaid:
  version: "11.16.0"
