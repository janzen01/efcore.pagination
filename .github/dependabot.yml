version: 2
updates:
  # NuGet dependencies are centrally managed in Directory.Packages.props.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "Npgsql.*"

  # The previous line. This file is read from the default branch only, so the servicing branch's updates
  # have to be declared here rather than in its own copy. A line is pinned to its EF Core major by
  # definition -- the package version tracks it in lockstep -- so a framework major is not an update
  # there but the next line, which already exists. Everything else flows the same way as above.
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "release/10.x"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.*"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "Npgsql.*"

  # Every action is pinned to a full commit SHA with the version in a trailing comment, so a
  # moved tag cannot change what runs. The publish job is why: it holds an OIDC-issued
  # nuget.org push key, and anything in that job can read it.
  #
  # Nothing is ignored here. A SHA does not follow releases, so minor and patch updates only
  # arrive as a Dependabot PR -- ignoring them would freeze the pins for good. Majors open the
  # same way and are the ones that need an actual decision before merging.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # One PR a week for every action rather than one per action. github/codeql-action alone
      # ships ~100 releases a year, so ungrouped this would be several PRs a week and the pins
      # would end up ignored -- which is the same as not pinning.
      actions:
        patterns:
          - "*"

  # The documentation site. `npm` is the ecosystem name for the whole family, so it reads the pnpm
  # lockfile too. Nothing here ships to a consumer -- a broken docs build stops a deploy, never an
  # install -- so it is grouped into one PR a week rather than triaged package by package.
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      docs:
        patterns:
          - "*"
