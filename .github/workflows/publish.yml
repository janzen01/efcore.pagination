name: Publish

on:
  release:
    types: [published]

permissions:
  # Attaching the packed files to the release is what makes the attestation below checkable:
  # nuget.org adds its own repository signature to every package it accepts, so the copy it
  # serves is not byte-identical to the one that was built and attested.
  contents: write
  id-token: write
  # Lets the job record a signed provenance statement for the packages it just built.
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The OIDC exchange below mints a live nuget.org push key, so the job waits for a manual
    # approval on the `nuget` environment first. nuget.org unlists but never deletes -- one
    # click is cheaper than a version that can only be withdrawn from search.
    environment: nuget
    env:
      # A published release is the only trigger, so this is always the release tag. There is
      # deliberately no fallback to github.ref_name -- that fallback is what would let a run
      # without a release carry a branch name all the way to the push step.
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag is what people see; Directory.Build.props is what actually gets packed.
      # Publishing 0.9.0 under a v10.0.0 release cannot be undone -- nuget.org allows
      # unlisting, never deletion -- so refuse before anything is built. An empty or
      # prefix-less tag fails this comparison too, which is the point.
      - name: Verify the tag matches the packed version
        run: |
          V=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          [ "v$V" = "$TAG" ] || { echo "refusing to publish: tag '$TAG' != version $V"; exit 1; }
          echo "tag $TAG matches version $V"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Janzen.Pagination.slnx

      - name: Build
        run: dotnet build Janzen.Pagination.slnx -c Release --no-restore -warnaserror

      # Publishing cannot be undone, so a red suite stops it here rather than after the push.
      - name: Test
        run: dotnet test Janzen.Pagination.slnx -c Release --no-build

      # Each package ships its own README, and nuget.org renders it against that one version
      # forever. Links to `master` would drift away from what the version documents, so pin
      # them to the release tag. Only this checkout is rewritten -- the repo keeps `master`
      # links, which is what someone browsing on GitHub wants.
      - name: Pin package README links to the release tag
        run: |
          sed -i "s|/blob/master/|/blob/$TAG/|g; s|/tree/master/|/tree/$TAG/|g" src/*/README.md
          echo "Pinned to $TAG:"
          grep -c "/$TAG/" src/*/README.md || true
          # Fail the publish rather than ship a readme still pointing at a moving branch.
          ! grep -rn "/blob/master/\|/tree/master/" src/*/README.md

      - name: Pack
        run: dotnet pack Janzen.Pagination.slnx -c Release --no-build -o ./artifacts

      # Records, in GitHub's transparency log, that these exact package files came out of this
      # repository and this workflow. Anyone can then check a downloaded package against it with
      # `gh attestation verify <file>.nupkg --repo janzen01/efcore.pagination`. nuget.org does not
      # read attestations today; this is verifiable independently of it, which is the point.
      - name: Attest the packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: './artifacts/*.nupkg'

      # Exchanges the job's OIDC token for a short-lived nuget.org API key, so no
      # long-lived secret is stored. Requires a Trusted Publishing policy on nuget.org.
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: janzen01

      - name: Push to nuget.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      # The attested bytes, published where anyone can check them: `gh attestation verify` compares
      # a file's digest against the provenance statement, and only these files still have that digest.
      # Runs after the push, so assets never appear for a version that failed to reach nuget.org.
      - name: Attach the packages to the release
        run: gh release upload "$TAG" ./artifacts/*.nupkg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
