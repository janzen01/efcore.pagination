name: Publish

on:
  release:
    types: [published]

# No workflow-level `permissions:` on purpose: `id-token: write` declared here would make a live
# nuget.org push key readable from every step of every job, restore and test included. Each job
# declares its own -- omit one and it inherits the repository default, so both are explicit.

jobs:
  # Everything that runs project code, with no credential in the job worth stealing.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A published release is the only trigger, so this is always the release tag. There is
      # deliberately no fallback to github.ref_name -- that fallback is what would let a run
      # without a release carry a branch name all the way to the push step.
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag is what people see; Directory.Build.props is what actually gets packed.
      # Publishing 0.9.0 under a v10.0.0 release cannot be undone -- nuget.org allows
      # unlisting, never deletion -- so refuse before anything is built. An empty or
      # prefix-less tag fails this comparison too, which is the point.
      - name: Verify the tag matches the packed version
        run: |
          V=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          [ "v$V" = "$TAG" ] || { echo "refusing to publish: tag '$TAG' != version $V"; exit 1; }
          echo "tag $TAG matches version $V"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Janzen.Pagination.slnx

      - name: Build
        run: dotnet build Janzen.Pagination.slnx -c Release --no-restore -warnaserror

      # Publishing cannot be undone, so a red suite stops it here rather than after the push.
      - name: Test
        run: dotnet test Janzen.Pagination.slnx -c Release --no-build

      # Each package ships its own README, and nuget.org renders it against that one version
      # forever. Links to `master` would drift away from what the version documents, so pin
      # them to the release tag. Only this checkout is rewritten -- the repo keeps `master`
      # links, which is what someone browsing on GitHub wants.
      - name: Pin package README links to the release tag
        run: |
          sed -i "s|/blob/master/|/blob/$TAG/|g; s|/tree/master/|/tree/$TAG/|g" src/*/README.md
          echo "Pinned to $TAG:"
          grep -c "/$TAG/" src/*/README.md || true
          # Fail the publish rather than ship a readme still pointing at a moving branch.
          ! grep -rn "/blob/master/\|/tree/master/" src/*/README.md

      - name: Pack
        run: dotnet pack Janzen.Pagination.slnx -c Release --no-build -o ./artifacts

      # The privileged job attests and pushes these exact bytes rather than rebuilding them.
      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: ./artifacts/*.nupkg
          if-no-files-found: error
          # Must outlast the environment approval below -- the publish job downloads this after a
          # human clicks, and an expired artefact would fail the release rather than delay it.
          retention-days: 7

  # The only job holding the credential. It runs no project code: attest, exchange, push.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The OIDC exchange below mints a live nuget.org push key, so a human approves first.
    environment: nuget
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # This job holds no checkout, so nothing here pins an SDK: without it the push below runs on whatever
      # the runner image happens to ship. That is the one step in the repository that cannot be dry-run —
      # `release: published` is the only trigger — so a missing SDK would surface with the tag already cut
      # and a human already through the approval gate.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Download the packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: ./artifacts

      # Records, in GitHub's transparency log, that these exact package files came out of this
      # repository and this workflow. Anyone can then check a downloaded package against it with
      # `gh attestation verify <file>.nupkg --repo janzen01/efcore.pagination`. nuget.org does not
      # read attestations today; this is verifiable independently of it, which is the point.
      - name: Attest the packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: './artifacts/*.nupkg'

      # Exchanges the job's OIDC token for a short-lived nuget.org API key, so no
      # long-lived secret is stored. Requires a Trusted Publishing policy on nuget.org.
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: janzen01

      - name: Push to nuget.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
