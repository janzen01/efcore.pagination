name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Janzen.Pagination.slnx

      - name: Build
        run: dotnet build Janzen.Pagination.slnx -c Release --no-restore -warnaserror


      - name: Pack
        run: dotnet pack Janzen.Pagination.slnx -c Release --no-build -o ./artifacts

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/janzen01/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
