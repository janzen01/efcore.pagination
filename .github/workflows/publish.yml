name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Janzen.Pagination.slnx

      - name: Build
        run: dotnet build Janzen.Pagination.slnx -c Release --no-restore -warnaserror

      - name: Pack
        run: dotnet pack Janzen.Pagination.slnx -c Release --no-build -o ./artifacts

      # Exchanges the job's OIDC token for a short-lived nuget.org API key, so no
      # long-lived secret is stored. Requires a Trusted Publishing policy on nuget.org.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: janzen01

      - name: Push to nuget.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
