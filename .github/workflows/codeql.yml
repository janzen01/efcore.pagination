name: CodeQL

on:
  push:
    branches: [ master, 'release/*' ]
  pull_request:
  schedule:
    # Weekly, so new queries also run against code that has not changed. A schedule only ever runs on the
    # default branch, so the servicing line gets no weekly scan -- dispatch it by hand when that matters.
    - cron: '0 5 * * 1'
  # Also the way to give a branch its first analysis when it appears by rename rather than by push.
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# A scheduled or push run has no head_ref, so it falls back to the unique run id and never cancels itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Deliberately outside ci.yml's `ci-ok`: findings here are triaged on the security dashboard, and a query
# that fires on pre-existing code should not block an unrelated merge.
jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: csharp
          # Buildless analysis — no .NET SDK to pin here, and no second build to keep green next to ci.yml's.
          # Switch to `build-mode: manual` + a `dotnet build` step if CodeQL starts
          # missing dataflow through the expression-tree builders.
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
