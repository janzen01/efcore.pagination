name: Docs build

# The VitePress build, called from two places: ci.yml verifies it on every pull request, docs.yml builds
# the artifact it deploys from the newest release. One copy, so the thing a PR verifies is the thing that gets
# published.
on:
  workflow_call:
    inputs:
      upload:
        description: Produce the GitHub Pages artifact for a caller that is going to deploy it.
        type: boolean
        default: false
    outputs:
      tag:
        description: The release this run built, when it built one to deploy -- docs.yml checks it independently.
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.newest.outputs.tag }}
    defaults:
      run:
        working-directory: docs
    steps:
      # fetch-depth: 0 is load-bearing, not a precaution. docs/scripts/sync-archive.mjs materializes one copy
      # of the site per released line by reading docs/src out of that line's tag, and the default shallow
      # checkout has no tags to read -- the build would fail before VitePress ever starts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A deploy builds the newest release in the repository, never the ref the event happened to bring. Two lines
      # publish into one site: a 10.x servicing release fires this from its own tag, and building that tag would
      # put 10.x back at the root over a newer line. So the site is rebuilt from the newest tag, whichever line it
      # belongs to, and the older lines arrive as archived copies -- sync-archive.mjs finds each line's newest
      # release itself. `versionsort.suffix=-` is what sorts a prerelease below its own release; plain version
      # order puts 11.0.0-rc.10 above 11.0.0. The Version check then catches a tag cut from the wrong commit.
      #
      # It runs before pnpm and Node are set up, so they read the lockfile of the tree being built. And it runs
      # from the *event's* copy of this file, not the newest tag's: a release of either line executes its own
      # branch's steps against the other line's tree, which is why this file must stay identical on both.
      - name: Check out the newest release
        id: newest
        if: inputs.upload
        working-directory: .
        run: |
          TAG=$(git -c versionsort.suffix=- tag -l 'v*' --sort=-v:refname | head -n 1)
          [ -n "$TAG" ] || { echo "::error::no v* tag to deploy"; exit 1; }
          git checkout --quiet --detach "refs/tags/$TAG"
          V=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)
          [ "v$V" = "$TAG" ] || { echo "::error::$TAG carries <Version>$V</Version>"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "deploying $TAG"

      # package_json_file is resolved against the REPOSITORY ROOT, which has no package.json -- the one
      # carrying `packageManager` lives in docs/. The `defaults.run.working-directory` above does not
      # help: it applies to `run:` steps only, never to a `uses:` step's inputs. Without this the action
      # finds no version to install and the job dies here, before it ever reaches the build.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Belongs before the build in GitHub's template, so that a site which does read base_path gets it.
      # This one hardcodes `base` in config.mts, so the step contributes nothing today -- but running it
      # out of order is the kind of thing that only bites once someone starts relying on the output.
      #
      # Guarded on the INPUT, never on github.event_name: inside a called workflow that expression is the
      # *caller's* event, so `!= 'pull_request'` would fire here on a fork PR -- a Pages API call that can
      # 403 and redden a required check on a pull request that has nothing to do with Pages.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: inputs.upload

      # docs:build ends in scripts/verify-frozen-urls.mjs and then scripts/verify-anchors.mjs. The first
      # fails if a URL that already shipped inside a released package stops existing; the second fails if
      # a link points at a heading that no longer does, which `ignoreDeadLinks` structurally cannot see.
      # Those two checks are the reason this job can be trusted, and the reason ci.yml requires it.
      - name: Build
        run: pnpm docs:build

      # A workflow_call job runs inside the CALLER's run, so this artifact is what the caller's own deploy
      # job picks up -- both sides use the default name, `github-pages`.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: inputs.upload
        with:
          path: docs/.dist
