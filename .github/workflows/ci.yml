name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so tag-driven versioning (MinVer) can resolve

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Janzen.Pagination.slnx

      - name: Build
        run: dotnet build Janzen.Pagination.slnx -c Release --no-restore -warnaserror

