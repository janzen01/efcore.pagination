name: Docs

# The site is a VitePress build, so Pages cannot serve it straight from the branch any more:
# Settings -> Pages -> Source is "GitHub Actions", and this workflow is what publishes.
#
# Deploy only. The build itself lives in docs-build.yml and runs on every pull request through ci.yml,
# where it is part of the required check -- so what lands here has already been verified. The trade-off
# is deliberate: the *deploy* wiring below (artifact hand-off, environment, concurrency) is no longer
# exercised before a merge, only by dispatching this workflow -- and now not even on every merge, so it
# goes months between real runs. Dispatch it once after changing anything below.
#
# Published on release, not on push. The site root is what the 10.0.0 package READMEs point at, and those
# renders on nuget.org are permanent -- so the root has to describe a version somebody can install. Building
# it from master would mean that during the next major's development every one of those frozen links led to
# documentation for code that is not released yet.
on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

# A queued deploy is worth more than an in-flight one, but canceling mid-deploy would leave the site
# half-published, so the running job is allowed to finish. Only deploys use this group now -- pull
# request builds run under ci.yml's own cancellable group instead of queueing behind a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # General availability only: a prerelease must not replace the public documentation, because the site
    # root is what an installed, released package points a reader at. Both halves are needed. `prerelease`
    # is the flag on the GitHub release, which is what the maintainer actually sets; the tag test is the
    # backstop for the release that gets published with the box left unticked, since every prerelease
    # version here carries a semver suffix (`-rc.1`, `-preview.1`) and no stable one does.
    # A dispatch is exempt -- it is the deliberate escape hatch, and it must be run against a tag.
    # Each event names itself, so anything added later is refused until it is thought about. Written as
    # `prerelease == false` alone this was fail-open for every event carrying no release payload: GitHub casts
    # both `null` and `false` to 0, so the comparison is true when there is no release at all, and
    # `contains(null, '-')` is false to match.
    #
    # A dispatch is the escape hatch for a documentation-only fix, so a branch may publish -- but a *tag* with
    # a semver suffix may not, which is the one thing a dispatch could otherwise do that a release cannot.
    if: >-
      (github.event_name == 'workflow_dispatch'
         && !(github.ref_type == 'tag' && contains(github.ref_name, '-')))
        || (github.event_name == 'release'
            && github.event.release.prerelease == false
            && !contains(github.event.release.tag_name, '-'))
    uses: ./.github/workflows/docs-build.yml
    with:
      upload: true

  # Skipped with `build`, because a skipped dependency leaves this unsatisfied rather than green.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A job-level permissions block REPLACES the workflow-level one rather than merging with it, so
    # contents: read has to be repeated here. deploy-pages does not check anything out today, but the
    # omission would only surface as a failure once someone adds a step that does.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The same rule as the `if:` on `build`, asserted again where the publishing actually happens. The gate
      # above cannot be tested before the event it guards -- a real release is the first thing that evaluates
      # its release half -- and a mistake there would put a prerelease at the site root, the one outcome this
      # workflow exists to prevent. Restating it costs a second and turns that mistake into a red release
      # instead of a silent publish. If this ever fires, the expression on `build` is wrong, not this step.
      #
      # It runs on both events now. Guarded on `github.event_name == 'release'` it was disarmed on exactly the
      # path a human drives, where the ref is chosen by hand in a dialog that defaults to a branch.
      - name: Refuse to publish a prerelease
        env:
          EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          name=""
          if [ "$EVENT" = release ]; then
            name=$TAG
            if [ "$PRERELEASE" != false ]; then
              echo "::error::$TAG is flagged as a prerelease; the gate on the build job should have skipped this run."
              exit 1
            fi
          elif [ "$REF_TYPE" = tag ]; then
            name=$REF_NAME
          fi

          case "$name" in
            *-*)
              echo "::error::$name carries a semver suffix; the gate on the build job should have skipped this run."
              exit 1
              ;;
          esac

          echo "${name:-$REF_NAME} may publish to the site root."

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
