name: Docs

# The site is a VitePress build, so Pages cannot serve it straight from the branch any more:
# Settings -> Pages -> Source is "GitHub Actions", and this workflow is what publishes.
#
# Deploy only. The build itself lives in docs-build.yml and runs on every pull request through ci.yml,
# where it is part of the required check -- so what lands here has already been verified. The trade-off
# is deliberate: the *deploy* wiring below (artifact hand-off, environment, concurrency) is no longer
# exercised before a merge, only by dispatching this workflow -- and now not even on every merge, so it
# goes months between real runs. Dispatch it once after changing anything below.
#
# Published on release, not on push, and always from the newest release in the repository (docs-build.yml checks
# it out): the site root is the newest line -- a preview included -- and every older line is an archived copy
# under /v<X.Y>.x/, which is what each package's README and project URL point at. A release of *either* line
# redeploys the whole site that way, so a 10.x servicing release refreshes /v10.1.x/ without touching the root.
# Building from master instead would publish documentation for code no release has shipped.
on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

# A queued deploy is worth more than an in-flight one, but canceling mid-deploy would leave the site
# half-published, so the running job is allowed to finish. Only deploys use this group now -- pull
# request builds run under ci.yml's own cancellable group instead of queueing behind a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Every event names itself, so anything added later is refused until it is thought about: written loosely,
    # a condition here was once fail-open for any event carrying no release payload. A prerelease deploys too,
    # on purpose -- the preview of a new major is meant to be used, and its docs with it.
    #
    # A dispatch is safe from any branch, because the build ignores the ref and takes the newest tag -- but not
    # against an old *tag*: the workflow file that runs is the one at the dispatched ref, and a tag from before
    # this logic (v10.1.1 and older) would rebuild itself and put that release back at the root. Dispatch from
    # master.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/docs-build.yml
    with:
      upload: true

  # Skipped with `build`, because a skipped dependency leaves this unsatisfied rather than green.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A job-level permissions block REPLACES the workflow-level one rather than merging with it, so
    # contents: read has to be repeated here -- the check below checks the repository out.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The build decides what is deployed, and fails unless it checked out the newest tag. This asks the same
      # question again without trusting it, for the one way that decision can go wrong silently: the two lines'
      # copies of docs-build.yml drifting apart. A release runs its own tag's copy, so a 10.x copy that lost the
      # checkout step would build 10.x and put it at the root over the newer line -- and would report no tag here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: Directory.Build.props
          sparse-checkout-cone-mode: false

      - name: Confirm the build took the newest release
        env:
          BUILT: ${{ needs.build.outputs.tag }}
        run: |
          NEWEST=$(git -c versionsort.suffix=- tag -l 'v*' --sort=-v:refname | head -n 1)
          [ -n "$BUILT" ] || { echo "::error::the build reported no tag -- its copy of docs-build.yml has drifted from this line's"; exit 1; }
          [ "$BUILT" = "$NEWEST" ] || { echo "::error::the build took $BUILT, but the newest release is $NEWEST"; exit 1; }
          echo "deploying $BUILT"

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
